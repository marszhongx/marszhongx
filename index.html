<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Zhong</title>
    <style>
        body {
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            font-family: sans-serif;
            background: 
                radial-gradient(circle at 0% 0%, rgba(74,74,233,0.15), transparent 50%),
                #111827;
            animation: gradientMove 10s ease-in-out infinite alternate;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            position: relative;
            z-index: 10;
        }

        .profile {
            text-align: center;
        }

        .avatar {
            margin-bottom: 2rem;
        }

        .avatar img {
            width: 9rem;
            height: 9rem;
            border-radius: 50%;
            margin: 0 auto;
            border: 4px solid #2563eb;
            transition: all 0.3s ease-in-out;
        }

        .avatar img:hover {
            transform: scale(1.05) rotate(6deg);
            box-shadow: 0 0 1.5rem rgba(59, 130, 246, 0.5);
        }

        .name {
            font-size: 2.25rem;
            font-weight: bold;
            position: relative;
            display: inline-block;
        }

        .name::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #2563eb;
            transition: width 0.3s ease;
        }

        .name:hover::after {
            width: 100%;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes slideInFromBottom {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-scale {
            animation: fadeInScale 1s ease-out;
        }

        .animate-slide-in-bottom {
            animation: slideInFromBottom 0.5s ease-out forwards;
        }

        .links {
            margin-top: 3rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-width: 180px;
            padding: 1.5rem 2rem;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(37, 99, 235, 0.2);
            border-color: #2563eb;
            box-shadow: 0 0 1.5rem rgba(59, 130, 246, 0.4);
        }

        .link-icon {
            font-size: 2rem;
        }

        .link-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .link-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
    <script src="https://trtc.io/knocket-sdk/sdk.js?identifier=182517b161c04a1ca9&v=1792044764341" async></script>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar animate-fade-in-scale">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=marszhong" 
                     alt="Mars Zhong">
            </div>
            <h1 class="name animate-slide-in-bottom">
                Mars Zhong
            </h1>
            <div class="links animate-slide-in-bottom">
                <a class="link-card" href="https://resume.marszhong.com/?lang=zh-CN&user=marszhongx&branch=main" target="_blank" rel="noopener noreferrer">
                    <span class="link-icon">📄</span>
                    <span class="link-name">Resume</span>
                    <span class="link-desc">visiky.github.io/resume</span>
                </a>
                <a class="link-card" href="https://blog.marszhong.com/" target="_blank" rel="noopener noreferrer">
                    <span class="link-icon">📝</span>
                    <span class="link-name">Blog</span>
                    <span class="link-desc">blog.marszhong.com</span>
                </a>
                <a class="link-card" href="https://yunwu.marszhong.com/" target="_blank" rel="noopener noreferrer">
                    <span class="link-icon">☁️</span>
                    <span class="link-name">Yunwu</span>
                    <span class="link-desc">yunwu.marszhong.com</span>
                </a>
                <a class="link-card" href="https://jsonx.marszhong.com/" target="_blank" rel="noopener noreferrer">
                    <span class="link-icon">🧩</span>
                    <span class="link-name">JSON X</span>
                    <span class="link-desc">jsonx.marszhong.com</span>
                </a>
                <a class="link-card" href="https://nodewarden.marszhong.com/" target="_blank" rel="noopener noreferrer">
                    <span class="link-icon">🛡️</span>
                    <span class="link-name">Node Warden</span>
                    <span class="link-desc">nodewarden.marszhong.com</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
